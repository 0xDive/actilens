name: Role web patch

on:
  push:
    branches: [feature/role-enforcement-ui]
    paths:
      - ".github/workflows/role-web-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-enforcement-ui
          fetch-depth: 0
      - name: Apply role-aware UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Employees: role column + owner-only role selector + capability-gated mutations.
          path = 'apps/web-admin/src/pages/Employees.tsx'
          replace(path,
          'import { Empty, Modal, Notice, Spinner } from "../components/ui";\n',
          'import { Empty, Modal, Notice, Spinner } from "../components/ui";\nimport { MemberRoleControl } from "../components/employee/MemberRoleControl";\n')
          replace(path,
          'import { useAuth } from "../auth/AuthContext";\n',
          'import { useAuth } from "../auth/AuthContext";\nimport { canManageMembers, canManageRoles } from "../rbac";\n')
          replace(path,
          '  const terms = memberTerms(selected?.kind);\n',
          '  const terms = memberTerms(selected?.kind);\n  const mayManageMembers = canManageMembers(selected?.role);\n  const mayManageRoles = canManageRoles(selected?.role);\n')
          old = '''          <button className="actilens-btn actilens-btn--primary" onClick={() => setShowEmp(true)}>\n            <span style={{ display: "inline-flex", lineHeight: 0 }}>{IconUserPlus}</span>\n            <span>{terms.addCta}</span>\n          </button>'''
          new = '''          {mayManageMembers && (\n            <button className="actilens-btn actilens-btn--primary" onClick={() => setShowEmp(true)}>\n              <span style={{ display: "inline-flex", lineHeight: 0 }}>{IconUserPlus}</span>\n              <span>{terms.addCta}</span>\n            </button>\n          )}'''
          replace(path, old, new)
          replace(path,
          '''                <th>{t("employees.table.login")}</th>\n                <th>{t("employees.table.currentApp")}</th>''',
          '''                <th>{t("employees.table.login")}</th>\n                <th>{t("employees.table.role")}</th>\n                <th>{t("employees.table.currentApp")}</th>''')
          replace(path,
          '''                const isSelf = e.id === user?.id;\n                const status = employeeStatus(e);''',
          '''                const isSelf = e.id === user?.id;\n                const status = employeeStatus(e);\n                const mayManageThis = mayManageMembers && !(selected?.role === "admin" && e.role === "admin");''')
          replace(path,
          '''                    <td className="ad-login">{e.email || e.username}</td>\n                    <td className="ad-login">{status === "offline" ? "—" : (e.current_app || "—")}</td>''',
          '''                    <td className="ad-login">{e.email || e.username}</td>\n                    <td>\n                      <MemberRoleControl\n                        employee={e}\n                        businessId={selectedId!}\n                        canChange={mayManageRoles}\n                        onChanged={() => selectedId && loadEmployees(selectedId)}\n                      />\n                    </td>\n                    <td className="ad-login">{status === "offline" ? "—" : (e.current_app || "—")}</td>''')
          old = '''                        <button className="actilens-btn actilens-btn--ghost" onClick={() => editEmployeeAccount(e)}>{t("employees.actions.edit")}</button>\n                        <button className="actilens-btn actilens-btn--ghost" onClick={() => changeEmployeePassword(e)}>{t("employees.actions.password")}</button>\n                        <button className="actilens-btn actilens-btn--ghost" onClick={() => toggleEmployeeActive(e)}>\n                          {t(e.active ? "employees.actions.archive" : "employees.actions.restore")}\n                        </button>'''
          new = '''                        {mayManageThis && (\n                          <>\n                            <button className="actilens-btn actilens-btn--ghost" onClick={() => editEmployeeAccount(e)}>{t("employees.actions.edit")}</button>\n                            <button className="actilens-btn actilens-btn--ghost" onClick={() => changeEmployeePassword(e)}>{t("employees.actions.password")}</button>\n                            <button className="actilens-btn actilens-btn--ghost" onClick={() => toggleEmployeeActive(e)}>\n                              {t(e.active ? "employees.actions.archive" : "employees.actions.restore")}\n                            </button>\n                          </>\n                        )}'''
          replace(path, old, new)
          replace(path, '{showEmp && (', '{showEmp && mayManageMembers && (', 1)

          # Detail: device management is owner/admin only.
          path = 'apps/web-admin/src/pages/EmployeeDetail.tsx'
          replace(path,
          'import { useDetailHeader } from "../detailHeader";\n',
          'import { useDetailHeader } from "../detailHeader";\nimport { canManageDevices } from "../rbac";\n')
          replace(path,
          '''  const { setTitle } = useDetailHeader();\n  const terms = memberTerms(businesses.find((b) => b.id === businessId)?.kind);''',
          '''  const { setTitle } = useDetailHeader();\n  const business = businesses.find((b) => b.id === businessId);\n  const terms = memberTerms(business?.kind);''')
          replace(path,
          '      <DevicesCard employeeId={id} />\n',
          '      {canManageDevices(business?.role) && <DevicesCard employeeId={id} />}\n')

          # App shell: managers do not get organization settings navigation.
          path = 'apps/web-admin/src/components/AppShell.tsx'
          replace(path,
          'import { DetailHeaderContext } from "../detailHeader";\n',
          'import { DetailHeaderContext } from "../detailHeader";\nimport { canManageSettings } from "../rbac";\n')
          old = '''  const NAV = [\n    { to: "/", label: t("nav.dashboard"), end: true, icon: <DashboardIcon /> },\n    { to: "/employees", label: terms.many, end: false, icon: <MembersIcon /> },\n    { to: "/settings", label: t("nav.settings"), end: false, icon: <SettingsIcon /> },\n  ];'''
          new = '''  const NAV = [\n    { to: "/", label: t("nav.dashboard"), end: true, icon: <DashboardIcon /> },\n    { to: "/employees", label: terms.many, end: false, icon: <MembersIcon /> },\n    ...(canManageSettings(selected?.role)\n      ? [{ to: "/settings", label: t("nav.settings"), end: false, icon: <SettingsIcon /> }]\n      : []),\n  ];'''
          replace(path, old, new)

          # Settings: direct URL access also respects capability, not only nav visibility.
          path = 'apps/web-admin/src/pages/Settings.tsx'
          replace(path,
          'import { memberTerms } from "../terms";\n',
          'import { memberTerms } from "../terms";\nimport { canManageSettings } from "../rbac";\n')
          replace(path,
          '  const terms = memberTerms(selected?.kind);\n',
          '  const terms = memberTerms(selected?.kind);\n  const mayManageSettings = canManageSettings(selected?.role);\n')
          replace(path,
          '      {!loading && businesses.length === 0 && <Empty>{t("noBusinesses")}</Empty>}\n\n      {selected && (',
          '      {!loading && businesses.length === 0 && <Empty>{t("noBusinesses")}</Empty>}\n      {selected && !mayManageSettings && <Notice kind="info">{t("roleDenied")}</Notice>}\n\n      {selected && mayManageSettings && (')

          # Audit: show role changes clearly.
          path = 'apps/web-admin/src/components/settings/AuditLogCard.tsx'
          replace(path,
          '  "device.restored": "deviceRestored",\n',
          '  "device.restored": "deviceRestored",\n  "member.role_changed": "memberRoleChanged",\n')
          replace(path,
          '''  if (typeof details.label === "string" && details.label) {\n    return details.label;\n  }''',
          '''  if (typeof details.label === "string" && details.label) {\n    return details.label;\n  }\n  if (typeof details.from === "string" && typeof details.to === "string") {\n    return `${details.from} → ${details.to}`;\n  }''')

          # Translations are updated structurally so JSON remains valid.
          for locale, labels in {
              'en': {
                  'role': 'Role', 'aria': 'Role for {{name}}',
                  'employee': 'Employee', 'manager': 'Manager', 'admin': 'Admin',
                  'denied': 'Your role can view reports, but organization settings require owner or admin access.',
                  'roleChanged': 'Member role changed', 'member': 'member',
              },
              'ru': {
                  'role': 'Роль', 'aria': 'Роль для {{name}}',
                  'employee': 'Сотрудник', 'manager': 'Менеджер', 'admin': 'Администратор',
                  'denied': 'Ваша роль позволяет смотреть отчёты, но настройки организации доступны только владельцу и администратору.',
                  'roleChanged': 'Роль участника изменена', 'member': 'участник',
              },
          }.items():
              dp = Path(f'apps/web-admin/src/i18n/locales/{locale}/dashboard.json')
              data = json.loads(dp.read_text())
              emp = data['employees']
              emp['table']['role'] = labels['role']
              emp['roleAria'] = labels['aria']
              emp['roles'] = {
                  'employee': labels['employee'],
                  'manager': labels['manager'],
                  'admin': labels['admin'],
              }
              dp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

              sp = Path(f'apps/web-admin/src/i18n/locales/{locale}/settings.json')
              sdata = json.loads(sp.read_text())
              sdata['roleDenied'] = labels['denied']
              sdata['audit']['actions']['memberRoleChanged'] = labels['roleChanged']
              sdata['audit']['targets']['member'] = labels['member']
              sp.write_text(json.dumps(sdata, ensure_ascii=False, indent=2) + '\n')
          PY

          git diff --check
      - name: Commit role-aware UI
        run: |
          git config user.name "0xDive Automation"
          git config user.email "72026841+0xDive@users.noreply.github.com"
          git add apps/web-admin/src
          git commit -m "feat: enforce roles in web console"
          git push origin HEAD:feature/role-enforcement-ui
