name: Device feature patch

on:
  push:
    branches: [feature/device-management-audit]
    paths:
      - ".github/workflows/device-feature-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/device-management-audit
          fetch-depth: 0

      - name: Patch large source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Web: render the device management card on employee details.
          replace_once(
              "apps/web-admin/src/pages/EmployeeDetail.tsx",
              'import { ScreenshotGallery } from "../components/reports/ScreenshotGallery";\n',
              'import { ScreenshotGallery } from "../components/reports/ScreenshotGallery";\nimport { DevicesCard } from "../components/employee/DevicesCard";\n',
          )
          replace_once(
              "apps/web-admin/src/pages/EmployeeDetail.tsx",
              '      {/* tabs + panel */}\n',
              '      <DevicesCard employeeId={id} />\n\n      {/* tabs + panel */}\n',
          )

          # Desktop: report stable workstation metadata with every batch sync.
          replace_once(
              "apps/desktop/src-tauri/src/sync/client.rs",
              '''struct BatchReq<'a> {\n    device_id: &'a str,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    device_label: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    business_id: Option<&'a str>,\n''',
              '''struct BatchReq<'a> {\n    device_id: &'a str,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    device_label: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    device_hostname: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    device_platform: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    device_arch: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    app_version: Option<&'a str>,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    business_id: Option<&'a str>,\n''',
          )
          replace_once(
              "apps/desktop/src-tauri/src/sync/client.rs",
              '''        let body = BatchReq {\n            device_id,\n            device_label: None,\n            business_id,\n''',
              '''        let hostname = std::env::var("COMPUTERNAME")\n            .or_else(|_| std::env::var("HOSTNAME"))\n            .ok()\n            .filter(|s| !s.trim().is_empty());\n        let body = BatchReq {\n            device_id,\n            device_label: hostname.as_deref(),\n            device_hostname: hostname.as_deref(),\n            device_platform: Some(std::env::consts::OS),\n            device_arch: Some(std::env::consts::ARCH),\n            app_version: Some(env!("CARGO_PKG_VERSION")),\n            business_id,\n''',
          )

          # Backend: employee creation is also an audited administrative action.
          replace_once(
              "apps/backend/internal/store/owner.go",
              '''\tif _, err := tx.Exec(ctx,\n\t\t`INSERT INTO memberships (user_id, business_id, role) VALUES ($1, $2, 'employee')`,\n\t\temp.ID, biz.ID,\n\t); err != nil {\n\t\treturn Employee{}, Business{}, err\n\t}\n\n\tif err := tx.Commit(ctx); err != nil {\n''',
              '''\tif _, err := tx.Exec(ctx,\n\t\t`INSERT INTO memberships (user_id, business_id, role) VALUES ($1, $2, 'employee')`,\n\t\temp.ID, biz.ID,\n\t); err != nil {\n\t\treturn Employee{}, Business{}, err\n\t}\n\n\tif err := insertAuditTx(ctx, tx, biz.ID, ownerID, "employee.created", "employee", emp.ID, map[string]any{\n\t\t"display_name": emp.DisplayName,\n\t}); err != nil {\n\t\treturn Employee{}, Business{}, err\n\t}\n\n\tif err := tx.Commit(ctx); err != nil {\n''',
          )
          PY

          git diff --check

      - name: Commit patch
        run: |
          git config user.name "0xDive Automation"
          git config user.email "72026841+0xDive@users.noreply.github.com"
          git add apps/web-admin/src/pages/EmployeeDetail.tsx apps/desktop/src-tauri/src/sync/client.rs apps/backend/internal/store/owner.go
          git commit -m "feat: connect device management across agent and admin"
          git push origin HEAD:feature/device-management-audit
