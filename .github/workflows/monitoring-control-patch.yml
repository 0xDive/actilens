name: Monitoring control patch

on:
  push:
    branches: [feature/monitoring-control-v2]
    paths:
      - ".github/workflows/monitoring-control-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monitoring-control-v2
          fetch-depth: 0
      - name: Apply monitoring control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, count))

          # Backend roster exposes the membership collection state.
          path = 'apps/backend/internal/store/owner.go'
          replace(path,
          '''\tRole          BusinessRole `json:"role"`\n\tLastSeen      *int64       `json:"last_seen"`''',
          '''\tRole              BusinessRole `json:"role"`\n\tMonitoringEnabled bool         `json:"monitoring_enabled"`\n\tLastSeen          *int64       `json:"last_seen"`''')
          replace(path, '\temp.Role = RoleEmployee\n', '\temp.Role = RoleEmployee\n\temp.MonitoringEnabled = true\n')
          replace(path,
          '''SELECT u.id, COALESCE(u.email, ''), COALESCE(u.username, ''), u.display_name, u.active, m.role,\n\t\t       (SELECT extract(epoch FROM max(d.last_seen_at))''',
          '''SELECT u.id, COALESCE(u.email, ''), COALESCE(u.username, ''), u.display_name, u.active, m.role, m.monitoring_enabled,\n\t\t       (SELECT extract(epoch FROM max(d.last_seen_at))''')
          replace(path,
          '''rows.Scan(&e.ID, &e.Email, &e.Username, &e.DisplayName, &e.Active, &e.Role,\n\t\t\t&e.LastSeen''',
          '''rows.Scan(&e.ID, &e.Email, &e.Username, &e.DisplayName, &e.Active, &e.Role, &e.MonitoringEnabled,\n\t\t\t&e.LastSeen''')

          # Desktop HTTP client: read monitoring state through existing memberships API.
          path = 'apps/desktop/src-tauri/src/sync/client.rs'
          replace(path,
          '''#[derive(Deserialize)]\nstruct PublicBusinessesResp {\n    businesses: Vec<PublicBusiness>,\n}\n''',
          '''#[derive(Deserialize)]\nstruct PublicBusinessesResp {\n    businesses: Vec<PublicBusiness>,\n}\n\n#[derive(Debug, Clone, Deserialize)]\nstruct MembershipState {\n    business_id: String,\n    #[serde(default = "default_true")]\n    monitoring_enabled: bool,\n}\n\n#[derive(Deserialize)]\nstruct MembershipsResp {\n    memberships: Vec<MembershipState>,\n}\n\nfn default_true() -> bool {\n    true\n}\n''')
          replace(path,
          '''    /// `GET /v1/policy` with auto-refresh on 401.\n    pub async fn fetch_policy(&self) -> Result<Policy, String> {''',
          '''    /// Return the server-controlled collection state for the current membership.\n    /// Old/partial records default to enabled for backward compatibility.\n    pub async fn monitoring_enabled(&self, business_id: Option<&str>) -> Result<bool, String> {\n        let mut token = self.access_token()?;\n        for attempt in 0..2 {\n            let resp = self\n                .http\n                .get(self.url("/v1/memberships/mine"))\n                .bearer_auth(&token)\n                .send()\n                .await\n                .map_err(net_err)?;\n            if resp.status() == reqwest::StatusCode::UNAUTHORIZED && attempt == 0 {\n                token = self.refresh().await?;\n                continue;\n            }\n            if !resp.status().is_success() {\n                return Err(status_err(resp).await);\n            }\n            let parsed: MembershipsResp = resp.json().await.map_err(|e| e.to_string())?;\n            if let Some(id) = business_id {\n                return parsed\n                    .memberships\n                    .into_iter()\n                    .find(|m| m.business_id == id)\n                    .map(|m| m.monitoring_enabled)\n                    .ok_or_else(|| "membership not found for selected business".to_string());\n            }\n            return match parsed.memberships.as_slice() {\n                [only] => Ok(only.monitoring_enabled),\n                [] => Ok(true),\n                _ => Err("multiple memberships: business id required".to_string()),\n            };\n        }\n        Err("monitoring_enabled: unreachable retry exhaustion".into())\n    }\n\n    /// `GET /v1/policy` with auto-refresh on 401.\n    pub async fn fetch_policy(&self) -> Result<Policy, String> {''')

          # Live tracker control gets a distinct server gate so admin-disabled and
          # user-paused states cannot overwrite each other.
          path = 'apps/desktop/src-tauri/src/trackers/mod.rs'
          replace(path,
          '''    pub paused: AtomicBool,\n    pub idle_threshold_s: AtomicU64,''',
          '''    pub paused: AtomicBool,\n    /// Server-controlled collection switch. Independent from the user's Pause.\n    pub org_monitoring_enabled: AtomicBool,\n    pub idle_threshold_s: AtomicU64,''')
          replace(path,
          '''            paused: AtomicBool::new(false),\n            idle_threshold_s:''',
          '''            paused: AtomicBool::new(false),\n            org_monitoring_enabled: AtomicBool::new(true),\n            idle_threshold_s:''')
          replace(path,
          '''    }\n}\n\n/// Screenshot capture modes''',
          '''    }\n\n    pub fn collection_allowed(&self) -> bool {\n        self.org_monitoring_enabled.load(Ordering::Relaxed)\n            && !self.paused.load(Ordering::Relaxed)\n    }\n}\n\n/// Screenshot capture modes''')
          replace(path,
          '''                && !control.paused.load(Ordering::Relaxed)\n                && control.count_keystrokes.load(Ordering::Relaxed)''',
          '''                && control.collection_allowed()\n                && control.count_keystrokes.load(Ordering::Relaxed)''')
          replace(path,
          '''pub fn capture_once(db: &Db, dir: &Path, control: &TrackerControl) -> usize {\n    if let Err(e) = std::fs::create_dir_all(dir) {''',
          '''pub fn capture_once(db: &Db, dir: &Path, control: &TrackerControl) -> usize {\n    if !control.collection_allowed() {\n        return 0;\n    }\n    if let Err(e) = std::fs::create_dir_all(dir) {''')
          replace(path,
          '''        if control.paused.load(Ordering::Relaxed) {\n            continue;\n        }''',
          '''        if !control.collection_allowed() {\n            continue;\n        }''')
          replace(path,
          '''        let paused = control.paused.load(Ordering::Relaxed);\n        // Idle covers screen-locked / display-asleep too: no input → idle grows.\n        let idle = crate::platform::idle_seconds();\n        let active = !paused && idle < threshold as f64;''',
          '''        // Idle covers screen-locked / display-asleep too: no input → idle grows.\n        let idle = crate::platform::idle_seconds();\n        let active = control.collection_allowed() && idle < threshold as f64;''')

          # Browser ingest drops all browsing data while org monitoring is disabled;
          # user on/off markers still behave as before for ordinary manual Pause.
          path = 'apps/desktop/src-tauri/src/server/mod.rs'
          replace(path,
          '''    let marker = is_marker(&v.url);\n    if !marker && s.control.paused.load(Ordering::Relaxed) {''',
          '''    let marker = is_marker(&v.url);\n    if !s.control.org_monitoring_enabled.load(Ordering::Relaxed) {\n        return StatusCode::OK;\n    }\n    if !marker && s.control.paused.load(Ordering::Relaxed) {''')

          # Managed status remembers the last known org monitoring state; default true
          # ensures an old/offline server does not accidentally disable personal use.
          path = 'apps/desktop/src-tauri/src/settings/mod.rs'
          replace(path,
          '''#[derive(Debug, Clone, Copy, Default, Serialize)]\npub struct CaptureManaged {''',
          '''#[derive(Debug, Clone, Copy, Serialize)]\npub struct CaptureManaged {''')
          replace(path,
          '''    pub family: bool,\n}\n\nimpl CaptureManaged {''',
          '''    pub family: bool,\n    /// Server-controlled membership collection switch.\n    pub monitoring_enabled: bool,\n}\n\nimpl Default for CaptureManaged {\n    fn default() -> Self {\n        Self {\n            managed: false,\n            allow_employee_override: false,\n            family: false,\n            monitoring_enabled: true,\n        }\n    }\n}\n\nimpl CaptureManaged {''')

          # Apply policy immediately after login/manual refresh and preserve last known
          # state on transient network errors.
          path = 'apps/desktop/src-tauri/src/commands/mod.rs'
          replace(path,
          '''    let client = BackendClient::new(backend_url(), auth.inner().clone());\n    let policy = client.fetch_policy().await?;\n\n    let status = crate::settings::CaptureManaged {\n        managed: policy.managed,\n        allow_employee_override: policy.allow_employee_override,\n        family: policy.kind.as_deref() == Some("family"),\n    };''',
          '''    let client = BackendClient::new(backend_url(), auth.inner().clone());\n    let policy = client.fetch_policy().await?;\n    let business_id = auth.session().and_then(|s| s.business_id);\n    let previous_monitoring = settings.managed.lock().unwrap().monitoring_enabled;\n    let monitoring_enabled = client\n        .monitoring_enabled(business_id.as_deref())\n        .await\n        .unwrap_or(previous_monitoring);\n\n    control\n        .org_monitoring_enabled\n        .store(monitoring_enabled, Ordering::Relaxed);\n\n    let status = crate::settings::CaptureManaged {\n        managed: policy.managed,\n        allow_employee_override: policy.allow_employee_override,\n        family: policy.kind.as_deref() == Some("family"),\n        monitoring_enabled,\n    };''')

          # Periodic sync refreshes the collection state too, so an administrator's
          # change reaches a running agent even if the settings screen is never opened.
          path = 'apps/desktop/src-tauri/src/sync/worker.rs'
          replace(path,
          '''    pub status: Arc<SyncStatus>,\n    /// Backend base URL + device_id are read fresh each pass so settings changes''',
          '''    pub status: Arc<SyncStatus>,\n    pub control: Arc<crate::trackers::TrackerControl>,\n    /// Backend base URL + device_id are read fresh each pass so settings changes''')
          replace(path,
          '''    let client = BackendClient::new(base_url, ctx.auth.clone());\n    let mut failed = false;''',
          '''    let client = BackendClient::new(base_url, ctx.auth.clone());\n\n    if let Ok(enabled) = client.monitoring_enabled(business_id.as_deref()).await {\n        ctx.control\n            .org_monitoring_enabled\n            .store(enabled, Ordering::Relaxed);\n    }\n    // Preserve the last known state when offline. Once the server disabled this\n    // membership, collection and upload remain stopped until a later successful\n    // policy refresh explicitly re-enables them.\n    if !ctx\n        .control\n        .org_monitoring_enabled\n        .load(Ordering::Relaxed)\n    {\n        return PassOutcome::Skipped;\n    }\n\n    let mut failed = false;''')

          # Pass the same live control to the worker.
          path = 'apps/desktop/src-tauri/src/lib.rs'
          replace(path,
          '''                status,\n                settings: settings_state,''',
          '''                status,\n                control: control.clone(),\n                settings: settings_state,''')

          # User cannot Start while the organization has disabled monitoring; manual
          # pause remains independent and will be restored when monitoring is re-enabled.
          path = 'apps/desktop/src-tauri/src/tray/mod.rs'
          replace(path,
          '''pub fn set_paused(app: &AppHandle, paused: bool) {\n    if let Some(c) = app.try_state::<Arc<TrackerControl>>() {\n        c.paused.store(paused, Ordering::Relaxed);\n    }''',
          '''pub fn set_paused(app: &AppHandle, paused: bool) {\n    if let Some(c) = app.try_state::<Arc<TrackerControl>>() {\n        if !paused && !c.org_monitoring_enabled.load(Ordering::Relaxed) {\n            refresh(app);\n            return;\n        }\n        c.paused.store(paused, Ordering::Relaxed);\n    }''')
          replace(path,
          '''    let (paused, threshold) = match app.try_state::<Arc<TrackerControl>>() {\n        Some(c) => (\n            c.paused.load(Ordering::Relaxed),\n            c.idle_threshold_s.load(Ordering::Relaxed) as f64,\n        ),\n        None => (false, 60.0),\n    };\n    let state = if paused {''',
          '''    let (paused, org_enabled, threshold) = match app.try_state::<Arc<TrackerControl>>() {\n        Some(c) => (\n            c.paused.load(Ordering::Relaxed),\n            c.org_monitoring_enabled.load(Ordering::Relaxed),\n            c.idle_threshold_s.load(Ordering::Relaxed) as f64,\n        ),\n        None => (false, true, 60.0),\n    };\n    let state = if paused || !org_enabled {''')
          replace(path,
          '''    let paused = state == State::Paused;\n    if let Some(items) = app.try_state::<MenuItems>() {\n        let _ = items.start.set_enabled(paused && !IN_SETUP.load(Ordering::Relaxed));\n        let _ = items.stop.set_enabled(!paused);\n    }''',
          '''    let paused = state == State::Paused;\n    let org_enabled = app\n        .try_state::<Arc<TrackerControl>>()\n        .map(|c| c.org_monitoring_enabled.load(Ordering::Relaxed))\n        .unwrap_or(true);\n    if let Some(items) = app.try_state::<MenuItems>() {\n        let _ = items.start.set_enabled(paused && org_enabled && !IN_SETUP.load(Ordering::Relaxed));\n        let _ = items.stop.set_enabled(!paused && org_enabled);\n    }''')

          # Web contract + endpoint.
          path = 'apps/web-admin/src/api/types.ts'
          replace(path,
          '''  active: boolean;\n  role?: BusinessRole;\n  last_seen?:''',
          '''  active: boolean;\n  role?: BusinessRole;\n  monitoring_enabled?: boolean;\n  last_seen?:''')
          path = 'apps/web-admin/src/api/endpoints.ts'
          replace(path,
          '''export function updateMemberRole(businessId: string, userId: string, role: Exclude<BusinessRole, "owner">) {\n  return request<{ status: string; role: BusinessRole }>(\n    `/v1/businesses/${businessId}/members/${userId}/role`,\n    { method: "PATCH", body: { role } },\n  );\n}\n''',
          '''export function updateMemberRole(businessId: string, userId: string, role: Exclude<BusinessRole, "owner">) {\n  return request<{ status: string; role: BusinessRole }>(\n    `/v1/businesses/${businessId}/members/${userId}/role`,\n    { method: "PATCH", body: { role } },\n  );\n}\n\nexport function updateMemberMonitoring(businessId: string, userId: string, enabled: boolean) {\n  return request<{ status: string; monitoring_enabled: boolean }>(\n    `/v1/businesses/${businessId}/members/${userId}/monitoring`,\n    { method: "PATCH", body: { enabled } },\n  );\n}\n''')

          # Member monitoring switch component.
          p = Path('apps/web-admin/src/components/employee/MemberMonitoringControl.tsx')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''import { useState } from "react";\nimport { useTranslation } from "react-i18next";\nimport { updateMemberMonitoring } from "../../api/endpoints";\nimport type { Employee } from "../../api/types";\n\nexport function MemberMonitoringControl({ employee, businessId, canChange, onChanged }: {\n  employee: Employee;\n  businessId: string;\n  canChange: boolean;\n  onChanged: () => void;\n}) {\n  const { t } = useTranslation("dashboard");\n  const [busy, setBusy] = useState(false);\n  const enabled = employee.monitoring_enabled !== false;\n\n  if (!canChange) {\n    return <span className="ad-self">{t(enabled ? "employees.monitoring.on" : "employees.monitoring.off")}</span>;\n  }\n\n  return (\n    <button\n      type="button"\n      className={`actilens-btn actilens-btn--ghost${enabled ? "" : " muted"}`}\n      disabled={busy}\n      aria-pressed={enabled}\n      aria-label={t("employees.monitoring.aria", { name: employee.display_name })}\n      onClick={async () => {\n        setBusy(true);\n        try {\n          await updateMemberMonitoring(businessId, employee.id, !enabled);\n          onChanged();\n        } catch {\n          window.alert(t("employees.prompts.failed"));\n        } finally {\n          setBusy(false);\n        }\n      }}\n    >\n      {busy ? t("employees.monitoring.saving") : t(enabled ? "employees.monitoring.on" : "employees.monitoring.off")}\n    </button>\n  );\n}\n''')

          # Employees table displays and controls monitoring separately from role.
          path = 'apps/web-admin/src/pages/Employees.tsx'
          replace(path,
          'import { MemberRoleControl } from "../components/employee/MemberRoleControl";\n',
          'import { MemberRoleControl } from "../components/employee/MemberRoleControl";\nimport { MemberMonitoringControl } from "../components/employee/MemberMonitoringControl";\n')
          replace(path,
          '''                <th>{t("employees.table.role")}</th>\n                <th>{t("employees.table.currentApp")}</th>''',
          '''                <th>{t("employees.table.role")}</th>\n                <th>{t("employees.table.monitoring")}</th>\n                <th>{t("employees.table.currentApp")}</th>''')
          replace(path,
          '''                    </td>\n                    <td className="ad-login">{status === "offline" ? "—" : (e.current_app || "—")}</td>''',
          '''                    </td>\n                    <td>\n                      <MemberMonitoringControl\n                        employee={e}\n                        businessId={selectedId!}\n                        canChange={mayManageThis}\n                        onChanged={() => selectedId && loadEmployees(selectedId)}\n                      />\n                    </td>\n                    <td className="ad-login">{status === "offline" ? "—" : (e.current_app || "—")}</td>''', 1)

          # Audit UI maps monitoring changes.
          path = 'apps/web-admin/src/components/settings/AuditLogCard.tsx'
          replace(path,
          '  "member.role_changed": "memberRoleChanged",\n',
          '  "member.role_changed": "memberRoleChanged",\n  "member.monitoring_changed": "memberMonitoringChanged",\n')

          # EN/RU text.
          for locale, values in {
              'en': {
                  'column': 'Monitoring', 'on': 'On', 'off': 'Off', 'saving': 'Saving…',
                  'aria': 'Monitoring for {{name}}', 'audit': 'Member monitoring changed',
              },
              'ru': {
                  'column': 'Мониторинг', 'on': 'Включён', 'off': 'Выключен', 'saving': 'Сохранение…',
                  'aria': 'Мониторинг для {{name}}', 'audit': 'Мониторинг участника изменён',
              },
          }.items():
              dp = Path(f'apps/web-admin/src/i18n/locales/{locale}/dashboard.json')
              data = json.loads(dp.read_text())
              data['employees']['table']['monitoring'] = values['column']
              data['employees']['monitoring'] = {
                  'on': values['on'], 'off': values['off'], 'saving': values['saving'], 'aria': values['aria'],
              }
              dp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

              sp = Path(f'apps/web-admin/src/i18n/locales/{locale}/settings.json')
              sdata = json.loads(sp.read_text())
              sdata['audit']['actions']['memberMonitoringChanged'] = values['audit']
              sp.write_text(json.dumps(sdata, ensure_ascii=False, indent=2) + '\n')
          PY

          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          gofmt -w apps/backend/internal/store apps/backend/internal/handlers
          git diff --check
      - name: Commit monitoring control
        run: |
          git config user.name "0xDive Automation"
          git config user.email "72026841+0xDive@users.noreply.github.com"
          git add apps/backend apps/desktop apps/web-admin
          git commit -m "feat: enforce member monitoring control end to end"
          git push origin HEAD:feature/monitoring-control-v2
