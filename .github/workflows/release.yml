name: ActiLens Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      # Public releases are server-agnostic. Deployment selects the backend at
      # runtime via install-windows-agent.ps1 / ACTILENS_BACKEND_URL.
      ACTILENS_BUILD_SERVER_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set application version from tag
        shell: pwsh
        run: python scripts/set-version.py $env:GITHUB_REF_NAME
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Install dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          pnpm install --frozen-lockfile
      - name: Build MSI and EXE
        shell: pwsh
        run: pnpm --filter @actilens/desktop tauri build --target x86_64-pc-windows-msvc
      - name: Normalize Windows release asset names
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1
          $exe = Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $msi) { throw 'MSI bundle was not produced' }
          if (-not $exe) { throw 'NSIS bundle was not produced' }
          New-Item -ItemType Directory -Force 'release-windows' | Out-Null
          Copy-Item -LiteralPath $msi.FullName -Destination 'release-windows/ActiLens-x64.msi'
          Copy-Item -LiteralPath $exe.FullName -Destination 'release-windows/ActiLens-x64-setup.exe'
          Copy-Item -LiteralPath 'install-windows-agent.ps1' -Destination 'release-windows/install-windows-agent.ps1'
          Get-ChildItem 'release-windows' | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: release-windows/*

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/0xdive/actilens
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ActiLens-x64.msi
            release-assets/ActiLens-x64-setup.exe
            release-assets/install-windows-agent.ps1
            install-windows-agent.ps1
          body: |
            ActiLens release.

            Docker image: `ghcr.io/0xdive/actilens:${{ github.ref_name }}`
            Windows client: server-agnostic; configure it during provisioning with `install-windows-agent.ps1`.
            Enrollment helper: `install-windows-agent.ps1`
