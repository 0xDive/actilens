name: ActiLens Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      ACTILENS_BUILD_SERVER_URL: ${{ vars.ACTILENS_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production backend URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACTILENS_BUILD_SERVER_URL)) {
            throw "Repository variable ACTILENS_SERVER_URL is required for production releases. Example: http://192.168.0.249:8081 or https://tracker.example.com"
          }
          $uri = $null
          if (-not [Uri]::TryCreate($env:ACTILENS_BUILD_SERVER_URL, [UriKind]::Absolute, [ref]$uri)) {
            throw "ACTILENS_SERVER_URL must be an absolute URL"
          }
          if ($uri.Scheme -notin @('http','https')) {
            throw "ACTILENS_SERVER_URL must use http or https"
          }
          Write-Host "Building ActiLens for backend: $($uri.AbsoluteUri.TrimEnd('/'))"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Install dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          pnpm install --frozen-lockfile
      - name: Build MSI and EXE
        shell: pwsh
        run: pnpm --filter @actilens/desktop tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/0xdive/actilens
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
          body: |
            ActiLens release.

            Docker image: `ghcr.io/0xdive/actilens:${{ github.ref_name }}`
            Windows client server: `${{ vars.ACTILENS_SERVER_URL }}`
