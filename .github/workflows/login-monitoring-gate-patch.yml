name: Login monitoring gate patch

on:
  push:
    branches: [feature/monitoring-control-v2]
    paths:
      - ".github/workflows/login-monitoring-gate-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monitoring-control-v2
          fetch-depth: 0
      - name: Close monitoring gate until server confirms it
        run: |
          echo '' | base64 -d > /tmp/login_patch.py
          python3 /tmp/login_patch.py
          git diff --check
      - name: Commit login gate fix
        run: |
          git config user.name "0xDive Automation"
          git config user.email "72026841+0xDive@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/commands/mod.rs
          git commit -m "fix: fail closed until monitoring policy resolves after login"
          git push origin HEAD:feature/monitoring-control-v2
