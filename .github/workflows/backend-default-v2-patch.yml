name: Backend default v2 patch

on:
  push:
    branches: [feature/windows-provisioning-v2]
    paths:
      - ".github/workflows/backend-default-v2-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-provisioning-v2
          fetch-depth: 0
      - name: Replace invalid backend fallback
        run: |
          python3 -c "from pathlib import Path; p=Path('apps/desktop/src-tauri/src/settings/mod.rs'); s=p.read_text(); old='https://github.com/0xDive/actilens'; assert s.count(old)==2, s.count(old); p.write_text(s.replace(old, 'http://127.0.0.1:8081'))"
          git diff --check
      - name: Commit fallback fix
        run: |
          git config user.name "0xDive Automation"
          git config user.email "72026841+0xDive@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/settings/mod.rs
          git commit -m "fix: use local backend as safe development fallback"
          git push origin HEAD:feature/windows-provisioning-v2
