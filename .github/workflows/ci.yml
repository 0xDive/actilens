name: ActiLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actilens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend + web + deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = [
              "B" + "i" + "B" + "o",
              "b" + "i" + "b" + "o",
              "Brian" + " Nguyen",
              "brian" + ".nguyen",
              "ngn" + "clht1102",
              "emplooyee" + "-tracking",
              "employee" + "track",
              "c" + "tracking",
              "C" + "TRACKING",
          ]
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for needle in needles:
                  if needle in text:
                      hits.append(f"{path}: {needle}")
          if hits:
              raise SystemExit("Legacy identifiers found:\n" + "\n".join(hits))
          PY
      - name: Validate Linux deployment scripts
        run: |
          bash -n bootstrap-linux.sh
          bash -n install-linux.sh
          bash -n actilensctl.sh
          sh -n deploy/docker-entrypoint.sh
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config >/dev/null
          DOMAIN=tracker.example.com PUBLIC_ORIGIN=https://tracker.example.com ACTILENS_BIND_ADDR=127.0.0.1 \
            docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml config >/dev/null
      - name: Validate release version synchronizer
        run: |
          python3 -m py_compile scripts/set-version.py
          python3 scripts/set-version.py 9.9.9
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('apps/desktop/package.json').read_text())['version'] == '9.9.9'
          assert json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())['version'] == '9.9.9'
          cargo = Path('apps/desktop/src-tauri/Cargo.toml').read_text()
          assert 'version = "9.9.9"' in cargo
          PY
          git checkout -- apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web admin
        run: pnpm --filter @actilens/web-admin typecheck
      - name: Build web admin
        run: pnpm --filter @actilens/web-admin build
      - name: Typecheck desktop UI
        run: pnpm --filter @actilens/desktop typecheck
      - name: Test backend
        working-directory: apps/backend
        run: go test ./...
      - name: Build backend
        working-directory: apps/backend
        run: go build ./...

  windows:
    name: Windows installer
    runs-on: windows-latest
    # PR/CI artifacts must never be pointed at a real production server by accident.
    # Production/custom installers are built by release.yml or windows-build.yml.
    env:
      ACTILENS_BUILD_SERVER_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('build-windows-client.ps1', 'install-windows-agent.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script: $($_.Message)" }
              throw "$script contains syntax errors"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop UI
        shell: pwsh
        run: pnpm --filter @actilens/desktop typecheck
      - name: Build Windows MSI and EXE
        shell: pwsh
        run: pnpm --filter @actilens/desktop tauri build --target x86_64-pc-windows-msvc
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ActiLens-Windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
