<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./brand/app-icon.svg" />
    <meta name="theme-color" content="#1769FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActiLens</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #ffffff;
      }
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 32px;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: #22242b;
        background: #ffffff;
      }
      .boot-fallback__card {
        max-width: 520px;
        text-align: center;
      }
      .boot-fallback__title {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      .boot-fallback__copy {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #6b7280;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite">
        <div class="boot-fallback__card">
          <p class="boot-fallback__title">Starting ActiLens…</p>
          <p class="boot-fallback__copy">
            If this message remains visible, the desktop interface could not be loaded.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
