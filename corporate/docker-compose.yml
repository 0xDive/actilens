services:
  db:
    image: postgres:16-alpine
    container_name: bibotracking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctracking-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ctracking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctracking} -d ${POSTGRES_DB:-ctracking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bibotracking:
    image: ${BIBO_IMAGE:-ghcr.io/0xdive/emplooyee-tracking:latest}
    build:
      context: ..
      dockerfile: corporate/Dockerfile
    container_name: bibotracking
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ctracking}:${POSTGRES_PASSWORD:-ctracking-change-me}@db:5432/${POSTGRES_DB:-ctracking}?sslmode=disable
      STORAGE_DIR: /app/storage
      STATIC_DIR: /app/static
      WEB_ADMIN_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8081}
      APP_ENV: production
      SENTRY_DSN: ""
      LOG_DIR: /app/logs
    ports:
      - "${BIBO_PORT:-8081}:8080"
    volumes:
      - screenshots:/app/storage
      - appconfig:/app/config
      - applogs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  screenshots:
  appconfig:
  applogs:
